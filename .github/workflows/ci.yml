name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Tests
        run: npm test

      # Validates generated -march strings against a real toolchain rather than
      # against our own model of the spec. This caught a case the unit tests
      # missed: excluding F for an E base while keeping D produced a string
      # clang rejects ("ILP32E cannot be used with the D ISA extension").
      # The toolchain has to be recent enough to know the extensions we emit.
      # ubuntu-24.04 ships clang 18, which rejects Ssccptr outright and treats
      # Zcmop as experimental — both are ratified and both appear in the RVA23
      # and RVB23 profiles. Validating against clang 18 would assert our strings
      # against a two-year-old view of the ISA and fail on correct output.
      - name: Install clang
        run: |
          set -euo pipefail
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 20
          echo "CLANG=clang-20" >> "$GITHUB_ENV"
      - name: Validate -march strings with clang
        run: |
          set -uo pipefail
          "$CLANG" --version | head -1
          fail=0
          while IFS=$'\t' read -r target march; do
            if "$CLANG" --target="$target" -march="$march" -x c /dev/null -fsyntax-only 2>/tmp/err; then
              echo "ok    $march"
            else
              echo "FAIL  $march  <- $(head -1 /tmp/err)"
              fail=1
            fi
          done < <(node scripts/emit-march-matrix.mjs)
          exit $fail

  # Publishes to the gh-pages branch, which is what Pages serves. Gated on
  # build-and-test so only tested code reaches the live site, and restricted to
  # pushes on main so pull requests never publish.
  deploy:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Publish dist/ to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -d dist || { echo "dist/ was not produced by the build"; exit 1; }
          touch dist/.nojekyll
          cd dist
          git init -q
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy: ${GITHUB_SHA::8} from main"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
          echo "published ${GITHUB_SHA::8} to gh-pages"
