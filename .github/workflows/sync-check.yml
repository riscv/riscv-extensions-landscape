name: Upstream Sync Check

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  sync-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Clone riscv-opcodes
        run: git clone --depth=1 https://github.com/riscv/riscv-opcodes.git /tmp/riscv-opcodes
      - name: Run sync check
        run: python3 sync_check.py --opcodes-path /tmp/riscv-opcodes
